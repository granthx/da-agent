[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "da-agent"
version = "0.1.0"
description = "Autonomous, tool-augmented data analysis agent powered by LangGraph, Pandas, and Groq."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "granthx" }
]
dependencies = [
    "langgraph>=1.1.0,<1.2.0",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
]
